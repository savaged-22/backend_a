spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${EMPLOYEE_DB}

spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# JWT Configuration
# ===============================
# Secreto para firmar el token (Por defecto un string largo para pasar la validación HMAC-SHA256 en dev)
app.jwt.secret=${JWT_SECRET:este_es_un_secreto_super_seguro_para_desarrollo_local_123}
# Tiempo de expiración en milisegundos (Por defecto 24 horas: 86400000 ms)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}